name: Compila e pubblica l'app Android

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.3'
          channel: 'stable'

      - name: Rimuovi il percorso JDK specifico del PC di sviluppo
        run: sed -i '/org.gradle.java.home/d' flutter_client/android/gradle.properties

      - name: Accetta le licenze Android SDK
        run: yes | flutter doctor --android-licenses || true

      - name: Installa le dipendenze Flutter
        working-directory: flutter_client
        run: flutter pub get

      - name: Compila l'APK
        working-directory: flutter_client
        run: flutter build apk --release

      - name: Rinomina l'APK
        id: apk
        run: |
          TAG=${GITHUB_REF_NAME#android-}
          NAME="fireshare-android-${TAG:-dev}.apk"
          cp flutter_client/build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FireShare Android ${{ steps.apk.outputs.tag }}
          files: ${{ steps.apk.outputs.name }}
