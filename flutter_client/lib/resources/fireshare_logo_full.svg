<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Oro Principale -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A1" />
      <stop offset="30%" stop-color="#FFE066" />
      <stop offset="70%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#C06000" />
    </linearGradient>

    <!-- Gradiente Glossy per l'effetto 3D/luce dall'alto -->
    <linearGradient id="glossGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Ombra morbida per staccare la nuvola dallo sfondo -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Ombra per il testo per dare l'effetto di sovrapposizione -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Dati Binari a cascata perpendicolare (Effetto Pioggia Digitale) -->
  <g fill="url(#goldGradient)" font-family="monospace, Consolas, sans-serif" font-weight="bold" text-anchor="middle">
    
    <!-- Colonna sinistra esterna -->
    <text x="100" y="150" font-size="20" fill-opacity="0.3">0</text>
    <text x="100" y="175" font-size="20" fill-opacity="0.6">1</text>
    <text x="100" y="200" font-size="20" fill-opacity="1.0">0</text>

    <!-- Colonna sinistra interna -->
    <text x="140" y="180" font-size="26" fill-opacity="0.4">1</text>
    <text x="140" y="210" font-size="26" fill-opacity="1.0">0</text>

    <!-- Colonna destra interna -->
    <text x="400" y="140" font-size="26" fill-opacity="0.3">1</text>
    <text x="400" y="170" font-size="26" fill-opacity="0.6">0</text>
    <text x="400" y="200" font-size="26" fill-opacity="1.0">1</text>

    <!-- Colonna destra esterna -->
    <text x="440" y="190" font-size="20" fill-opacity="0.4">0</text>
    <text x="440" y="215" font-size="20" fill-opacity="0.7">1</text>
    <text x="440" y="240" font-size="20" fill-opacity="1.0">0</text>

  </g>

  <!-- Gruppo Nuvola con ombra esterna -->
  <g filter="url(#cloudShadow)">
    
    <!-- Base dorata -->
    <g fill="url(#goldGradient)">
      <circle cx="270" cy="240" r="90" />
      <circle cx="180" cy="290" r="65" />
      <circle cx="360" cy="280" r="75" />
      <path d="M 180 355 L 360 355 A 75 75 0 0 0 360 205 L 180 225 A 65 65 0 0 0 180 355 Z" />
      <rect x="180" y="225" width="180" height="130" />
    </g>

    <!-- Livello Glossy (Effetto 3D riflettente) sovrapposto -->
    <g fill="url(#glossGradient)">
      <circle cx="270" cy="240" r="90" />
      <circle cx="180" cy="290" r="65" />
      <circle cx="360" cy="280" r="75" />
      <path d="M 180 355 L 360 355 A 75 75 0 0 0 360 205 L 180 225 A 65 65 0 0 0 180 355 Z" />
      <rect x="180" y="225" width="180" height="130" />
    </g>
    
  </g>

  <!-- Iniziali FS a cavallo del bordo inferiore, bianche e con ombra -->
  <text x="270" y="365" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="130" fill="#FFFFFF" text-anchor="middle" letter-spacing="-6" filter="url(#textShadow)">FS</text>
</svg>